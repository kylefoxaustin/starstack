    <rect x="-18" y="-42" width="6" height="88" rx="3" fill="#ffffff" opacity="0.18"/> <!-- sheen -->
  </g>
</g>
  <!-- wordmark -->
  <text x="352" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-weight="bold" font-size="88" fill="#f4efe6" letter-spacing="-2">starstack</text>
  <text x="356" y="200" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#c9cfe0">Stacking for people who'd rather be looking up.</text>
  <text x="356" y="246" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#8a93ad">dump the folder in.  push the button.  go outside.</text>
  <!-- button -->
  <g transform="translate(985 52) scale(0.54)">
  <!-- The Big Red Button. -->
  <defs>
    <linearGradient id="b_bezel" x1="0" y1="0" x2="0" y2="1">
