  <!-- bezel ring -->
  <circle cx="200" cy="200" r="132" fill="url(#b_bezel)"/>
  <circle cx="200" cy="200" r="118" fill="#1c1f24"/>
  <!-- button side (height) -->
  <ellipse cx="200" cy="214" rx="104" ry="100" fill="url(#b_side)"/>
  <!-- cap -->
  <ellipse cx="200" cy="192" rx="104" ry="96" fill="url(#b_cap)"/>
  <!-- highlight -->
  <ellipse cx="170" cy="150" rx="46" ry="22" fill="#ffffff" opacity="0.22"/>
  <!-- label -->
  <text x="200" y="208" text-anchor="middle" font-family="Impact, 'Arial Black', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#fff4ee" letter-spacing="4">STACK</text>
</g>
